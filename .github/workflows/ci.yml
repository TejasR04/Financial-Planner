name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian_test
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian_test
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m piptools compile --strip-extras --resolver=backtracking --output-file=requirements.txt pyproject.toml
      - run: python -m piptools compile --strip-extras --resolver=backtracking --extra=dev --output-file=requirements-dev.txt pyproject.toml
      - run: git diff --exit-code requirements.txt requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m mypy
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=60

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
