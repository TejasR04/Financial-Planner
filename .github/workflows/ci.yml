name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api/v1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian_test
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian_test
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests
      - run: python -m mypy
      - run: python -m alembic upgrade head
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=60 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            summary=$(grep -E '^(FAILED|ERROR) ' pytest.log | paste -sd ';' -)
            if [[ -z "$summary" ]]; then
              summary=$(tail -n 5 pytest.log | paste -sd ' ' -)
            fi
            echo "::error::$summary"
          fi
          exit "$status"

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
